name: Agents Management CI

on:
  push:
    branches: ["main"]
    paths:
      - "agents-management/**"
      - ".github/workflows/**"
  pull_request:
    branches: ["main"]
    paths:
      - "agents-management/**"
      - ".github/workflows/**"

jobs:
  build:
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: agents-management

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: agents-management/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: TypeScript check
        run: npm run typecheck --if-present

      - name: Build Web
        run: npm run build

      - name: Run Tests
        run: npm test --if-present
